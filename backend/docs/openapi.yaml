# OpenAPI 3.1 paths for the send-flow and statement endpoints (#62–#65).
#
# The full spec for every /api/v1 route is tracked in issue #15; this file
# covers the routes added/changed by #62, #63, #64 and #65 and reuses the
# shared error envelope + examples from ./openapi-errors.yaml so it can be
# merged into that spec unchanged.
#
# Mock server (#27): `npm run mock` serves this file with Prism on port 4010
# using the `examples` below (static, not dynamic). Force an error example
# with the `Prefer: code=429` header — see backend/README.md.
openapi: 3.1.0
info:
  title: GlobeWallet API — send flow & statements
  version: "1.0"
servers:
  - url: http://localhost:4000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      $ref: "./openapi-errors.yaml#/components/schemas/ErrorResponse"
    Amount:
      type: string
      pattern: '^\d+(\.\d{1,7})?$'
      description: Positive decimal string, at most 7 decimal places. Never a JSON number.
      example: "12.5"
    AccountId:
      type: string
      pattern: "^G[A-Z2-7]{55}$"
      description: Checksum-validated Stellar account ID (G...).
      example: "GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN"
    Asset:
      type: string
      description: '"XLM" or "CODE:ISSUER". Defaults to XLM when omitted.'
      example: "USDC:GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN"
    SendOperationType:
      type: string
      enum: [payment, createAccount]
      description: >-
        Operation the build path uses (#65). `createAccount` is chosen
        automatically when the destination does not exist, the asset is XLM
        and amount >= 1 XLM.
    SendPrecheckWarning:
      type: object
      required: [code, message, blocking]
      properties:
        code:
          type: string
          enum:
            - DESTINATION_IS_SOURCE
            - SOURCE_NOT_FUNDED
            - DESTINATION_NOT_FUNDED
            - DESTINATION_WILL_BE_CREATED
            - NO_TRUSTLINE
            - TRUSTLINE_NOT_AUTHORIZED
            - MEMO_REQUIRED
            - AMOUNT_EXCEEDS_SPENDABLE
        message:
          type: string
        blocking:
          type: boolean
          description: True when submitting as-is would fail on-chain or risk losing funds.
    SendPrecheckResponse:
      type: object
      required: [warnings, blocking, operationType]
      properties:
        warnings:
          type: array
          items: { $ref: "#/components/schemas/SendPrecheckWarning" }
        blocking:
          type: boolean
          description: True if any warning is blocking — do not offer "Sign".
        operationType:
          $ref: "#/components/schemas/SendOperationType"
        spendable:
          type: string
          description: >-
            Source's spendable balance of the asset (XLM: balance minus
            minimum reserve, selling liabilities and one base fee). Omitted
            when the source account does not exist.
    ResolvedAddress:
      type: object
      required: [type, accountId]
      properties:
        type:
          type: string
          enum: [account, muxed, federation]
        accountId:
          $ref: "#/components/schemas/AccountId"
        memo:
          type: string
          description: Memo returned by the federation server (federation only). Attach it to the payment.
        memoType:
          type: string
          enum: [text, id, hash]
        muxedId:
          type: string
          description: Muxed sub-account ID as a decimal string (muxed only).
        muxedAddress:
          type: string
          description: The original M... address (muxed only).
    AccountBalance:
      type: object
      required: [asset, balance]
      properties:
        asset:
          type: string
          description: '"XLM" or "CODE:ISSUER".'
        balance:
          $ref: "#/components/schemas/Amount"
        spendable:
          type: string
          description: Balance minus reserve/liabilities; omitted for non-native assets.
    Account:
      type: object
      required: [accountId, balances]
      properties:
        accountId:
          $ref: "#/components/schemas/AccountId"
        balances:
          type: array
          items: { $ref: "#/components/schemas/AccountBalance" }
        sequence:
          type: string
          description: Current account sequence number as a decimal string.
    RecoveryStatus:
      type: string
      enum: [pending, approved, executed, cancelled, expired]
    Recovery:
      type: object
      required: [id, accountId, status, createdAt]
      properties:
        id:
          type: string
        accountId:
          $ref: "#/components/schemas/AccountId"
        status:
          $ref: "#/components/schemas/RecoveryStatus"
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        newOwner:
          $ref: "#/components/schemas/AccountId"
  responses:
    ValidationError:
      description: Input failed validation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            invalid:
              $ref: "./openapi-errors.yaml#/components/examples/BadRequest400"
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            code: AUTH_HEADER_INVALID
            error: Missing or malformed Authorization header
    RateLimited:
      description: Too many requests (force with `Prefer: code=429`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            code: RATE_LIMITED
            error: Too many requests, retry after 30s
            retryable: true

paths:
  /api/v1/wallet/send/precheck:
    post:
      summary: Check a send for problems before signing (#64)
      description: >-
        Read-only. Loads the source and destination accounts and reports
        every known reason the payment would fail or lose funds: destination
        missing (and whether it would be created), missing/unauthorized
        trustline, SEP-29 memo required, sending to yourself, and amount
        above the spendable balance. A well-formed request always returns
        200; problems come back as warnings.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourcePublicKey, destinationPublicKey, amount]
              properties:
                sourcePublicKey: { $ref: "#/components/schemas/AccountId" }
                destinationPublicKey: { $ref: "#/components/schemas/AccountId" }
                amount: { $ref: "#/components/schemas/Amount" }
                asset: { $ref: "#/components/schemas/Asset" }
                memo:
                  type: string
                  description: MEMO_TEXT, at most 28 UTF-8 bytes.
            examples:
              usdcPayment:
                summary: USDC payment to a funded account
                value:
                  sourcePublicKey: "GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN"
                  destinationPublicKey: "GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5"
                  amount: "12.5"
                  asset: "USDC:GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN"
      responses:
        "200":
          description: Precheck result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendPrecheckResponse" }
              examples:
                memoRequired:
                  value:
                    warnings:
                      - code: MEMO_REQUIRED
                        message: The destination requires a memo (SEP-29), e.g. an exchange deposit ID. Sending without one may lose funds.
                        blocking: true
                    blocking: true
                    operationType: payment
                    spendable: "98.4999900"
                willCreate:
                  value:
                    warnings:
                      - code: DESTINATION_WILL_BE_CREATED
                        message: Destination account does not exist yet. It will be created and funded with this amount.
                        blocking: false
                    blocking: false
                    operationType: createAccount
                    spendable: "98.4999900"
                ok:
                  value:
                    warnings: []
                    blocking: false
                    operationType: payment
                    spendable: "98.4999900"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/wallet/send:
    post:
      summary: Send a payment (createAccount for unfunded XLM destinations, #65)
      description: >-
        If the destination does not exist and the asset is XLM with
        amount >= 1, a `createAccount` operation is submitted instead of
        `payment`. Otherwise an unfunded destination is rejected with
        `DESTINATION_NOT_FUNDED` before anything is signed.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  hash: { type: string }
                  successful: { type: boolean }
              examples:
                submitted:
                  value:
                    hash: "3389e9f0f1a65f19736cacf544c2e825313e8447f569233bb8db39aa607c8889"
                    successful: true
        "400":
          description: Validation failure, MEMO_REQUIRED or DESTINATION_NOT_FUNDED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                destinationNotFunded:
                  value:
                    code: DESTINATION_NOT_FUNDED
                    error: Destination account GB... does not exist. Only XLM can be sent to a new account (at least 1 XLM, via createAccount).
                    details:
                      reason: NON_NATIVE_ASSET
                      destination: GB...
                      minimumStartingBalance: "1"
                    retryable: false
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/wallet/partial-transaction:
    post:
      summary: Build an unsigned transaction for signing
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Unsigned transaction envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  xdr: { type: string }
                  networkPassphrase: { type: string }
              examples:
                unsigned:
                  value:
                    xdr: "AAAAAgAAAAB..."
                    networkPassphrase: "Test SDF Network ; September 2015"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/accounts/{accountId}:
    get:
      summary: Account balances (XLM + USDC)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: accountId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/AccountId" }
      responses:
        "200":
          description: Account with balances
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
              examples:
                xlmAndUsdc:
                  value:
                    accountId: "GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN"
                    sequence: "123456789012345678"
                    balances:
                      - asset: XLM
                        balance: "100.0000000"
                        spendable: "98.4999900"
                      - asset: "USDC:GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN"
                        balance: "250.0000000"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Account not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                code: ACCOUNT_NOT_FOUND
                error: Account does not exist on the network
                retryable: false
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/recovery:
    get:
      summary: List recovery requests
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Recovery requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Recovery" }
              examples:
                pendingRecovery:
                  value:
                    - id: "rec_01HZX8K3"
                      accountId: "GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN"
                      status: pending
                      createdAt: "2024-01-15T10:00:00Z"
                      expiresAt: "2024-01-22T10:00:00Z"
                      newOwner: "GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
