name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "packages/**"
      - "package.json"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "packages/**"
      - "package.json"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        # Installed at the repo root (npm workspaces — see root package.json)
        # so the backend's "@stellar-global-wallet/types" workspace
        # dependency (packages/types) resolves. No root package-lock.json is
        # committed yet (see PR description for why), so this uses
        # `npm install` rather than `npm ci`; switch back to `npm ci` with
        # setup-node's built-in npm cache once one is generated and committed.
        run: npm install

      - name: Type-check
        run: npm run type-check --workspace backend

      - name: Check i18n catalogue completeness
        run: npm run i18n:check --workspace=packages/i18n

      - name: Test
        # Route tests assert supertest responses against backend/openapi.yaml
        # via jest-openapi (see backend/tests/env.setup.ts), so this step
        # fails CI when a route and the OpenAPI spec drift apart.
        run: npm test --workspace backend
